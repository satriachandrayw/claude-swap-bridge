name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Run tests
        # The plugin's own suite imports no Hermes modules — it exercises the pure
        # decision function, the settings/conflict logic, and the cswap wrapper
        # against stubs — so it needs only pytest.
        run: python -m pytest -q tests
      - name: Compile check
        run: python -m compileall -q .
